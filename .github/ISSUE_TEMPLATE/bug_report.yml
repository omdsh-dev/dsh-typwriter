name: Bug report
description: Report a bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing an issue.

        If you are reporting a problem with compiling or previewing a document, please check first:

        1. Is the project's main file the one you mean to compile?
        2. Does the document compile outside Typwriter, with `typst compile` in a terminal?
        3. If possible, attach the compiler's output, in full or at least the part with the error

        If you are reporting a problem with the live preview, say whether the compiled PDF looks right while the preview does not.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages if any.
  - type: input
    id: version
    attributes:
      label: Typwriter version
      description: The version shown at the bottom of the Help menu, or the plugin version you installed
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
  - type: input
    id: tex
    attributes:
      label: TeX distribution
      description: Only if compile-related
      placeholder: e.g. TeX Live 2025, MiKTeX, MacTeX
  - type: input
    id: compile-command
    attributes:
      label: Compile command
      description: Terminal > Configure compile command
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >-
        Anything else that helps: screenshots, compile logs, or a minimal .tex file
        that reproduces the problem. For round-trip issues (the file changed after
        saving), please attach the original file and describe the edit.
